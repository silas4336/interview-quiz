# =====================================================================
# TableCheck 自動訂位機器人設定檔
# 複製此檔為 config.yaml 後修改（config.yaml 已被 .gitignore 忽略，
# 不會被 commit，請放心填入個人資料）
# =====================================================================

# 餐廳在 tablecheck.com 網址上的代稱。
# 例如 https://www.tablecheck.com/en/shops/ramenbreakbeats/reserve
# 對應的 shop_slug 就是 "ramenbreakbeats"
shop_slug: "ramenbreakbeats"

# 介面語言，會組成網址 /en/ 或 /ja/ ...（建議用你登入時習慣的語言）
locale: "en"

# ---------------------------------------------------------------------
# 搶位的時間設定
# ---------------------------------------------------------------------
# 這家店「每天晚上 9:00（日本時間）開放 7 天後」的訂位。
timezone: "Asia/Tokyo"

# 每天觸發搶位的時刻（24 小時制，timezone 時區）。
open_time: "21:00:00"

# 提前幾秒「喚醒」並開始猛刷頁面（在 open_time 前 N 秒就把頁面準備好）。
warmup_seconds: 20

# open_time 之後最多嘗試幾秒就放棄（避免無限卡住）。
attempt_window_seconds: 90

# 目標訂位日期離「今天」幾天。開放的是 7 天後，所以通常填 7。
target_days_ahead: 7

# 也可以直接指定固定日期（會覆蓋 target_days_ahead），格式 YYYY-MM-DD；
# 留空表示用 target_days_ahead 自動計算。
target_date: ""

# ---------------------------------------------------------------------
# 訂位內容
# ---------------------------------------------------------------------
# 用餐人數
party_size: 2

# 想要的時段（優先順序，由上往下嘗試）。文字要跟頁面上顯示的時段一致，
# 例如 "18:00" / "6:00 PM"，依網站顯示為準。第一個搶到就停。
preferred_times:
  - "18:00"
  - "18:30"
  - "19:00"
  - "19:30"
  - "20:00"

# 若 preferred_times 全部搶不到，是否退而求其次選「任何可訂的時段」。
accept_any_time: false

# ---------------------------------------------------------------------
# 帳號 / 付款
# ---------------------------------------------------------------------
# 建議事先用 `python bot.py --login` 手動登入一次，session 會被記住，
# 之後搶位就不用再輸入帳密、速度也最快。
# 若要讓程式自動登入，可在這裡填（留空則仰賴已儲存的 session）。
email: ""
password: ""

# 這家店每人有 ¥500 不可退訂金，送出訂位＝要付款。
# true  = 搶到時段後「停在付款前一步」，由你手動完成付款（較安全，但可能因猶豫被搶走）
# false = 一路自動送出（需帳號內已綁好付款方式，速度最快）
stop_before_payment: true

# ---------------------------------------------------------------------
# 通知
# ---------------------------------------------------------------------
notify:
  # 終端機嗶聲
  beep: true
  # 搶到（或需要你手動付款）時要執行的指令，留空則不執行。
  # 例如 macOS 桌面通知：
  #   command: 'osascript -e ''display notification "搶到位子了!" with title "TableCheck"'''
  command: ""
